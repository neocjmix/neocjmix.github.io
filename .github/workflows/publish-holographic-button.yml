name: Publish Holographic Button

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
    paths:
      - ".github/workflows/publish-holographic-button.yml"

concurrency:
  group: holographic-button-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-tag:
    name: Create the release tag
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Create tag from package version
        run: |
          package_version="$(node -p "require('./holographic-cta-lab/react/package.json').version")"
          release_tag="v$package_version"

          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "$release_tag already exists; nothing to do."
          else
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/$release_tag"
          fi

  publish:
    name: Verify and publish to npm
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: holographic-cta-lab/react
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Validate tag, package version, and release branch
        id: package
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_REF_TYPE" == "tag" ]]; then
            release_tag="$RELEASE_REF_NAME"
          else
            release_tag="v$package_version"
          fi
          tag_version="${release_tag#v}"

          if [[ "$release_tag" != v* ]] || [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $release_tag must match package version $package_version." >&2
            exit 1
          fi

          git fetch origin master
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/master; then
            echo "Release tag must point to a commit contained in origin/master." >&2
            exit 1
          fi

          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish package
        id: publish
        env:
          # Required only for the first publish. Delete this repository secret
          # after configuring npm Trusted Publishing for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --access public --ignore-scripts --provenance
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          PACKAGE_NAME: ${{ needs.publish.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package_version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; nothing to do."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$PACKAGE_NAME v$PACKAGE_VERSION"
          fi
